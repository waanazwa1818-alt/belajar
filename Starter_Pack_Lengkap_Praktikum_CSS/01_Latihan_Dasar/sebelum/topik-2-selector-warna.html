<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Topik 2: Selectors & Warna</title>
    <style>
         /* Targetkan ID judul-utama */
        #judul-utama {
            color: #38BDF8;
        }

        /* Targetkan Class tombol */
        .tombol {
            background-color: #2563EB;
            color: white;
        }

        /* Efek ketika mouse diarahkan ke tombol */
        .tombol:hover {
            background-color: orange;
        }
        
    </style>
</head>
<body>
    <h1 id="judul-utama">Belajar CSS Selectors</h1>
    <button class="tombol">Klik Saya</button>
</body>
</html>
