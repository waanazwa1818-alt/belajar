<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>10 - Galeri Gambar - Toko Bunga</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff7fb;
            margin: 0;
            padding: 40px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .img-box {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 15px;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: 0.4s;
        }

        .img-box img:hover {
            filter: grayscale(0);
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Ubah class ".gallery" menjadi CSS Grid
       dengan grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))
       dan beri gap.
    2. Pada ".img-box", gunakan aspect-ratio: 1/1,
       overflow: hidden, dan border-radius.
    3. Pada <img>, gunakan width: 100%, height: 100%,
       object-fit: cover.
    4. Tambahkan filter grayscale(100%) dan transition.
    5. Saat hover, ubah grayscale menjadi 0 dan
       gunakan transform: scale(1.1).
    -->

    <div class="gallery">

        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=500"
                 alt="Bunga Pink">
        </div>

        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?w=500"
                 alt="Buket Bunga">
        </div>

        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=500"
                 alt="Bunga Mawar">
        </div>

        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1509223197845-458d87318791?w=500"
                 alt="Bunga Cantik">
        </div>

        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1495231916356-a86217efff12?w=500"
                 alt="Bunga Putih">
        </div>

        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1468327768560-75b778cbb551?w=500"
                 alt="Buket Bunga Pink">
        </div>

    </div>

</body>
</html>
