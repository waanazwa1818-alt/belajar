<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus 1: Profil Card Sederhana</title>
    <style>
        /* TUGAS:
           1. Berikan kontener lebar 300px, padding 24px, border-radius 12px, dan box-shadow.
           2. Buat avatar menjadi bulat dengan border-radius 50%.
           3. Ganti warna background tombol, hapus border, dan tambahkan efek hover (transform/cursor).
        */
        
        .kontener {
            width: 300px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-family: Arial, sans-serif;
        }
        
        .avatar {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        
        button {
            background-color: #af4c5c;
            border: none;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 6px;
        }
        
        button:hover {
            background-color: #b51d52;
            transform: scale(1.05);
        }   
    </style>
</head>
<body>
    <div class="kontener">
        <img src="WhatsApp Image 2026-09-21 at 10.23.37 AM.jpeg" alt="Avatar" class="avatar">
        <h2>AWA NAZWA</h2>
        <p>Frontend Developer | Tech Educator</p>
        <p>Passionate about clean code and modern UI/UX.</p>
        <button>Follow AWA</button>
    </div>
</body>
</html>
