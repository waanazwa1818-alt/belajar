
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Jurnal Umum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="jurnal-page">

    <main class="jurnal-container">
        <section class="jurnal-card">

            <header class="jurnal-header">
                <h1>Form Input Jurnal Umum</h1>
                <p>PT Prima Akuntindo</p>
            </header>

            <form action="#" method="post">

                <div class="jurnal-form-group">
                    <label for="tanggal">Tanggal Transaksi</label>
                    <input
                        type="date"
                        id="tanggal"
                        name="tanggal"
                        required
                    >
                </div>

                <div class="jurnal-form-group">
                    <label for="keterangan">Keterangan</label>
                    <textarea
                        id="keterangan"
                        name="keterangan"
                        rows="3"
                        placeholder="Masukkan keterangan transaksi"
                        required
                    ></textarea>
                </div>

                <div class="jurnal-form-group">
                    <label for="nama-akun">Nama Akun</label>
                    <select id="nama-akun" name="nama_akun" required>
                        <option value="">-- Pilih Nama Akun --</option>
                        <option value="kas">Kas</option>
                        <option value="piutang">Piutang Usaha</option>
                        <option value="perlengkapan">Perlengkapan</option>
                        <option value="peralatan">Peralatan</option>
                        <option value="utang">Utang Usaha</option>
                        <option value="modal">Modal</option>
                        <option value="pendapatan">Pendapatan</option>
                        <option value="beban">Beban</option>
                    </select>
                </div>

                <fieldset class="jurnal-form-group">
                    <legend>Posisi Saldo</legend>

                    <div class="radio-options">
                        <label>
                            <input
                                type="radio"
                                name="posisi_saldo"
                                value="debit"
                                required
                            >
                            Debit
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="posisi_saldo"
                                value="kredit"
                            >
                            Kredit
                        </label>
                    </div>
                </fieldset>

                <div class="jurnal-form-group">
                    <label for="nominal">Nominal (Rp)</label>
                    <input
                        type="number"
                        id="nominal"
                        name="nominal"
                        min="0"
                        step="any"
                        placeholder="Masukkan nominal"
                        required
                    >
                </div>

                <div class="jurnal-actions">
                    <button type="submit" class="jurnal-submit">
                        SIMPAN JURNAL
                    </button>

                    <button type="reset" class="jurnal-reset">
                        RESET
                    </button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
